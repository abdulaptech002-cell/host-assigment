<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Details | Hotel Point</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">HOTEL POINT</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="hotels.html">Hotels</a></li>
        <li><a href="hotel-details.html" class="active">Details</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="booking.html">Booking</a></li>
    </ul>
</header>

<section class="hotel-details" id="container"></section>

<script>
const hotels = {
  "royal-palace-karachi": {
    name: "Royal Palace Hotel",
    location: "Karachi",
    price: "$180",
    desc: "Luxury hotel in Karachi",
    img: "https://images.unsplash.com/photo-1566073771259-6a8506099945"
  },
  "grand-lahore-hotel": {
    name: "Grand Lahore Hotel",
    location: "Lahore",
    price: "$160",
    desc: "Luxury hotel in Lahore",
    img: "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa"
  },
  "capital-view-islamabad": {
    name: "Capital View Hotel",
    location: "Islamabad",
    price: "$210",
    desc: "Beautiful hotel in Islamabad",
    img: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267"
  },
  "mountain-retreat-murree": {
    name: "Mountain Resort",
    location: "Murree",
    price: "$240",
    desc: "Hill station luxury hotel",
    img: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
  },
  "skardu-resort-luxury": {
    name: "Skardu Resort",
    location: "Skardu",
    price: "$300",
    desc: "Mountain paradise resort",
    img: "https://images.unsplash.com/photo-1445019980597-93fa8acb246c"
  },
  "hunza-valley-inn": {
    name: "Hunza Valley Inn",
    location: "Hunza",
    price: "$280",
    desc: "Peaceful valley stay",
    img: "https://images.unsplash.com/photo-1455587734955-081b22074882"
  },
  "pearl-residency": {
    name: "Pearl Residency",
    location: "Karachi",
    price: "$140",
    desc: "Affordable hotel",
    img: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"
  },
  "northern-crown": {
    name: "Northern Crown",
    location: "Gilgit",
    price: "$260",
    desc: "Top northern resort",
    img: "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4"
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const container = document.getElementById("container");

// SINGLE HOTEL VIEW
if (id && hotels[id]) {

  const h = hotels[id];

  container.innerHTML = `
    <div class="single-hotel">
        <img src="${h.img}" style="width:100%; max-height:400px; object-fit:cover;">
        <h1>${h.name}</h1>
        <p>📍 ${h.location}</p>
        <p>${h.price}</p>
        <p>${h.desc}</p>
    </div>
  `;

// ALL HOTELS VIEW
} else {

  container.innerHTML = Object.values(hotels).map(h => `
    <div class="hotel-card" style="margin-bottom:20px;">
        <img src="${h.img}" style="width:100%; height:250px; object-fit:cover;">
        <div style="padding:10px;">
            <h2>${h.name}</h2>
            <p>📍 ${h.location}</p>
            <p>${h.price}</p>
            <p>${h.desc}</p>
        </div>
    </div>
  `).join("");

}
</script>

</body>
</html>
